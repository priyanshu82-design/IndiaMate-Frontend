<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiaMate — Trusted Travel App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone" id="phoneShell">
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar-icons">●●●  📶  🔋</span>
  </div>

  <header class="appbar">
    <button class="appbar-back" id="backBtn" aria-label="Go back" hidden>←</button>
    <button class="appbar-avatar" id="avatarMenuBtn" aria-label="Open Profile Menu" hidden>P</button>
    <div class="appbar-title"><span class="wordmark">IndiaMate</span></div>
    <button class="appbar-sos" id="sosBtn" aria-label="Emergency SOS">SOS</button>
  </header>

  <!-- Side Profile Menu Drawer -->
  <div class="side-menu-overlay" id="sideMenuOverlay"></div>
  <div class="side-menu" id="sideMenu">
    <div class="side-menu-top">
      <button class="side-menu-close" id="closeMenuBtn">←</button>
      <span class="side-menu-brand">IndiaMate</span>
    </div>
    
    <div class="side-profile-box">
      <div class="profile-avatar" id="sideAvatarText">P</div>
      <div>
        <div class="side-profile-name" id="sideProfileName">Traveler</div>
        <div class="side-profile-upi" id="sideProfileUpi">UPI ID: user@indiamate <span>📑</span></div>
      </div>
    </div>

    <!-- NEW: Receive Payments Box (Moved here as requested) -->
    <div style="margin: 0 16px;">
      <div style="background: var(--turmeric-deep); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; border: 1px solid rgba(0,0,0,0.05);" onclick="alert('Opening Payment Scanner...')">
        <div style="width: 56px; height: 56px; background: #5a4b66; border-radius: 14px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border: 3px solid #d3c4e3;">
           <div style="width: 22px; height: 22px; border: 2px solid #fff; border-radius: 6px;"></div>
        </div>
        <div style="font-weight: 700; color: var(--indigo); font-size: 13.5px;">Receive Payments</div>
      </div>
    </div>

    <!-- SIDEBAR DRAWER: Travel Mode Switcher (Green Box Position) -->
    <div style="padding: 10px 14px 4px 14px;">
      <div style="font-size: 9px; font-weight: 800; color: var(--indigo-soft); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;">
        Travel Mode
      </div>
      <div style="background: var(--turmeric-deep); border-radius: 10px; padding: 3px; display: flex; gap: 3px;">
        <button onclick="window.switchTravelPersona('international')" style="flex: 1; border: none; padding: 7px 4px; font-size: 10.5px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: all 0.2s; ${state.persona === 'international' ? 'background: var(--madder); color: #fff; box-shadow: 0 2px 6px rgba(139,38,53,0.3);' : 'background: transparent; color: var(--indigo-soft);'}">
          🌍 Foreigner
        </button>
        <button onclick="window.switchTravelPersona('domestic')" style="flex: 1; border: none; padding: 7px 4px; font-size: 10.5px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: all 0.2s; ${state.persona === 'domestic' ? 'background: var(--indigo); color: #fff; box-shadow: 0 2px 6px rgba(28,40,65,0.3);' : 'background: transparent; color: var(--indigo-soft);'}">
          🇮🇳 Domestic
        </button>
      </div>
    </div>

    <!-- Pushed Down Menu List -->
    <div class="side-menu-list" style="margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px;">
      <button class="side-menu-item" data-goto="profile"><span class="icon">👤</span> Profile & Settings</button>
      <button class="side-menu-item" data-goto="itinerary"><span class="icon">◷</span> My Plan</button>
      <button class="side-menu-item" style="color:var(--madder);" id="menuLogoutBtn"><span class="icon">🚪</span> Log Out</button>
    </div>
  </div>

  <!-- Main Views -->
  <main id="view" class="view"></main>

  <!-- Recent Apps / History Modal -->
  <div id="recentModal" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="margin-bottom: 70px;">
      <button class="modal-close" id="closeRecentBtn">✕</button>
      <div class="modal-stamp" style="color:var(--indigo);">APP HISTORY</div>
      <h3 style="font-family:'Fraunces',serif; margin:4px 0 12px; color:var(--indigo);">Recent Tabs</h3>
      <div id="recentHistoryList" class="history-list"></div>
      <button class="btn btn-ghost" id="clearHistoryBtn" style="margin-top:14px; width:100%; color:var(--madder); border-color:var(--madder);">Clear History</button>
    </div>
  </div>

  <!-- Floating Pill Navigation -->
  <nav class="galaxy-pill-nav">
    <button class="tab" data-view="pay"><span class="tab-icon">₹</span><span>Pay</span></button>
    <button class="tab" data-view="food"><span class="tab-icon">☘</span><span>Food</span></button>
    <button class="tab" data-view="crafts"><span class="tab-icon">◈</span><span>Crafts</span></button>
  </nav>

  <!-- Android 3-Button White Navigation Bar -->
  <div class="system-nav-bar">
    <button class="sys-nav-btn recent" id="sysRecentBtn" aria-label="Recent Apps">|||</button>
    <button class="sys-nav-btn home" id="sysHomeBtn" aria-label="Home"></button>
    <button class="sys-nav-btn back" id="sysBackBtn" aria-label="Back">‹</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
